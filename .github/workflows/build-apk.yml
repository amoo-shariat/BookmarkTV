name: Build debug APK

# This workflow installs Gradle itself (via gradle/actions/setup-gradle) rather
# than relying on a checked-in gradlew wrapper jar, since this project was
# generated without network access to download that binary. If you later run
# `gradle wrapper` locally (or let Android Studio generate one on first open),
# you can switch this back to the usual `./gradlew assembleDebug` if preferred.

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BookmarkTV-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK as a public Release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "BookmarkTV debug build #${{ github.run_number }}"
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
